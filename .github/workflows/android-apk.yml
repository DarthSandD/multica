name: Android APK

# Personal Android build of the official Multica mobile app (DARR-41 port).
# Manual trigger only: no build runs on push. Produces a standalone RELEASE
# APK, signed with the Android debug keystore generated in this job (test
# signing only, no production key), which installs directly on a phone
# without a Metro dev server.
#
# Why this is a release build, not debug (2026-10-25 crash fix):
# The previous workflow ran assembleDebug with APP_ENV set only on the
# prebuild step. Gradle re-evaluates the Expo config itself in the
# expo-constants:createExpoConfig task, so without APP_ENV on the Gradle
# step it fell back to the development variant (Multica (Dev),
# ai.multica.mobile.dev), and a debug build skips JS bundling entirely,
# leaving an app that throws "EXPO_PUBLIC_API_URL is not set" at import
# time and expects a Metro server. This workflow therefore sets the
# production env on BOTH the prebuild step and the Gradle (bundling)
# step, verifies the generated prod variant before building, and runs
# assembleRelease so the Hermes bundle is embedded.
# The android/ directory is generated by prebuild in this job, never committed.

on:
  workflow_dispatch:
  # TEMPORARY probe (DARR-41 UI/UX build): workflow_dispatch returns
  # 422 "Actions has been disabled" despite the repo reporting
  # enabled:true. If a push to main starts this job, dispatch is the
  # broken path, not Actions itself. Revert this trigger once the
  # build is queued.
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: ubuntu-latest already ships the Android SDK
      # (ANDROID_HOME set, cmdline-tools + build-tools installed), and
      # android-actions/setup-android@v3 fails on the removed 'tools'
      # package (sdkmanager exit 1). Gradle uses the preinstalled SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Install dependencies
        working-directory: .
        run: pnpm install

      - name: Prebuild Android (production)
        env:
          CI: "1"
          NODE_ENV: production
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.multica.ai
          EXPO_PUBLIC_WEB_URL: https://multica.ai
        run: |
          export APP_ENV=production NODE_ENV=production
          export EXPO_PUBLIC_API_URL=https://api.multica.ai
          export EXPO_PUBLIC_WEB_URL=https://multica.ai
          npx expo prebuild --platform android --clean

      - name: Verify production variant
        # Fail fast if prebuild produced the dev variant again: the
        # generated app must be "Multica" with package ai.multica.mobile,
        # never "Multica (Dev)" / ai.multica.mobile.dev.
        run: |
          grep -q '<string name="app_name">Multica</string>' android/app/src/main/res/values/strings.xml
          grep -q "applicationId 'ai.multica.mobile'" android/app/build.gradle
          if grep -q 'ai.multica.mobile.dev' android/app/build.gradle android/app/src/main/res/values/strings.xml; then
            echo "ERROR: dev variant leaked into generated Android project"
            exit 1
          fi

      - name: Ensure test signing keystore
        # Release builds use signingConfigs.debug in the generated
        # build.gradle. Prebuild normally generates android/app/debug.keystore;
        # create one with the standard debug credentials if it is absent,
        # so assembleRelease is always signed and installable.
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l android/app/debug.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          CI: "1"
          NODE_ENV: production
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.multica.ai
          EXPO_PUBLIC_WEB_URL: https://multica.ai
        run: |
          export APP_ENV=production NODE_ENV=production
          export EXPO_PUBLIC_API_URL=https://api.multica.ai
          export EXPO_PUBLIC_WEB_URL=https://multica.ai
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify release bundle
        # Static checks alone passed on the previous release build while the
        # app still crashed on a real phone, so fail the job here if the
        # release bundle is missing, empty, or was bundled without the
        # production API URL (the import-time throw in data/api.ts).
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          rm -rf /tmp/apk-check && mkdir -p /tmp/apk-check
          unzip -o -q "$APK" assets/index.android.bundle assets/app.config -d /tmp/apk-check
          test -s /tmp/apk-check/assets/index.android.bundle
          grep -a -q "api.multica.ai" /tmp/apk-check/assets/index.android.bundle
          grep -q "production" /tmp/apk-check/assets/app.config
          ls -l "$APK" /tmp/apk-check/assets/index.android.bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multica-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
