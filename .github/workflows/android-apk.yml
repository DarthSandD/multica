name: Android APK

# Personal Android build of the official Multica mobile app (DARR-41 port).
# Manual trigger only: no build runs on push. Produces a debug APK, which
# needs no signing secrets and installs directly on a phone for testing.
# The android/ directory is generated by prebuild in this job, never committed.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: ubuntu-latest already ships the Android SDK
      # (ANDROID_HOME set, cmdline-tools + build-tools installed), and
      # android-actions/setup-android@v3 fails on the removed 'tools'
      # package (sdkmanager exit 1). Gradle uses the preinstalled SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Install dependencies
        working-directory: .
        run: pnpm install

      - name: Prebuild Android
        env:
          CI: "1"
          APP_ENV: production
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: apps/mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multica-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
