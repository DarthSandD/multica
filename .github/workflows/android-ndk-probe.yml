name: Android NDK Probe (temporary diagnostic)

# Temporary diagnostic for DARR-41: which NDK on the runner ships a
# libc++_shared.so that exports __cxa_init_primary_exception, the symbol
# fbjni 0.7.0's libfbjni.so needs but NDK 27's libc++_shared lacks?
# Manual trigger only. Delete this workflow once the target NDK is chosen.
# It builds nothing and publishes nothing.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NDK libc++_shared symbols
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/ndk"
          for ndk in "$ANDROID_HOME"/ndk/*/; do
            echo "=== NDK: $ndk ==="
            for triple in x86_64-linux-android aarch64-linux-android; do
              lib=$(find "$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$triple" -maxdepth 1 -name "libc++_shared.so" 2>/dev/null | head -1)
              if [ -n "$lib" ]; then
                echo "-- $triple: $lib"
                echo "   __cxa_init_primary_exception count: $(readelf --dyn-syms -W "$lib" | grep -c '__cxa_init_primary_exception' || true)"
                echo "   total __cxa_ defined: $(readelf --dyn-syms -W "$lib" | grep -c ' __cxa_' || true)"
              else
                echo "-- $triple: libc++_shared.so NOT FOUND"
              fi
            done
          done
      - name: Confirm fbjni 0.7.0 reference (Maven Central AAR)
        run: |
          cd /tmp
          curl -sS -O https://repo.maven.apache.org/maven2/com/facebook/fbjni/fbjni/0.7.0/fbjni-0.7.0.aar
          mkdir -p fbjni-aar && cd fbjni-aar
          unzip -o -q ../fbjni-0.7.0.aar 'jni/*'
          for lib in $(find jni -name "libfbjni.so"); do
            echo "=== $lib ==="
            readelf --dyn-syms -W "$lib" | grep "__cxa_init_primary_exception" || echo "(no such reference)"
            readelf -d "$lib" | grep NEEDED
          done
